name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_and_test:
    name: 🧹 Lint and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine3.23
        env:
          POSTGRES_USER: dahlia
          POSTGRES_PASSWORD: dahlia # pragma: allowlist secret
          POSTGRES_DB: dahlia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dedicated database for integration tests (created/migrated by the harness).
      TEST_DATABASE_URL: postgresql://dahlia:dahlia@localhost:5432/dahlia_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup env file
        run: cp .env.example .env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tools-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test run

      - name: Integration tests
        run: pnpm test:integration
