allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
confirmModulesPurge: false
verifyDepsBeforeRun: false
overrides:
  # CVE-2026-53632 (GHSA-v6wh-96g9-6wx3): launch-editor NTLMv2 hash disclosure
  # via Windows UNC paths, pulled in transitively through vite (dev only).
  # Force the patched 8.0.16 release.
  vite: "8.0.16"
